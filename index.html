<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tâches">
<title>Tâches du jour</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --done: #16a34a;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f12;
      --card: #1c1c21;
      --text: #f2f2f5;
      --muted: #9ca3af;
      --border: #2d2d35;
      --accent: #818cf8;
      --accent-soft: #25254a;
      --done: #22c55e;
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  main { max-width: 560px; margin: 0 auto; }
  header { padding: 20px 0 12px; }
  h1 { font-size: 28px; margin: 0; }
  .date { color: var(--muted); text-transform: capitalize; margin-top: 2px; }
  .progress {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 16px; margin: 12px 0 16px;
  }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; }
  .progress-count { font-weight: 600; }
  .streak { color: var(--muted); font-size: 14px; }
  .bar { height: 10px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .bar.full > div { background: var(--done); }

  ul { list-style: none; padding: 0; margin: 0; }
  .task {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 14px; margin-bottom: 10px; min-height: 60px;
    user-select: none; cursor: pointer;
  }
  .check {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--border); display: grid; place-items: center;
    transition: background .15s, border-color .15s;
  }
  .check svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
  .task.done .check { background: var(--done); border-color: var(--done); }
  .task.done .check svg { opacity: 1; }
  .task-name { flex: 1; word-break: break-word; }
  .task.done .task-name { color: var(--muted); text-decoration: line-through; }
  .task-time { color: var(--muted); font-size: 13px; }

  .edit-btns { display: none; gap: 4px; }
  body.editing .edit-btns { display: flex; }
  body.editing .check { display: none; }
  body.editing .task { cursor: default; }
  .icon-btn {
    border: 0; background: var(--accent-soft); color: var(--text); border-radius: 10px;
    width: 38px; height: 38px; font-size: 16px; cursor: pointer;
  }
  .icon-btn.del { color: var(--danger); }

  .empty { text-align: center; color: var(--muted); padding: 32px 8px; }

  form.add { display: none; gap: 8px; margin: 6px 0 16px; }
  body.editing form.add { display: flex; }
  form.add input {
    flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  .btn {
    font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 16px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  .btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions .btn { flex: 1; }

  h2 { font-size: 17px; margin: 28px 0 10px; }
  .history { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    aspect-ratio: 1; border-radius: 10px; background: var(--border);
    display: grid; place-items: center; font-size: 12px; color: var(--muted);
  }
  .day.lvl1 { background: color-mix(in srgb, var(--done) 30%, var(--border)); color: var(--text); }
  .day.lvl2 { background: color-mix(in srgb, var(--done) 60%, var(--border)); color: var(--text); }
  .day.lvl3 { background: var(--done); color: #fff; }
  .day.today { outline: 2px solid var(--accent); outline-offset: 1px; }
  .legend { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .data-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .data-btns .btn { flex: 1; font-size: 14px; padding: 10px 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tâches du jour</h1>
    <div class="date" id="date"></div>
  </header>

  <section class="progress">
    <div class="progress-top">
      <span class="progress-count" id="count">0 / 0</span>
      <span class="streak" id="streak"></span>
    </div>
    <div class="bar" id="bar"><div></div></div>
  </section>

  <form class="add" id="addForm" autocomplete="off">
    <input id="newTask" placeholder="Nouvelle tâche (ex : Faire du sport)" maxlength="80">
    <button class="btn" type="submit">Ajouter</button>
  </form>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>Aucune tâche pour l'instant.<br>Appuie sur « Modifier la liste » pour en ajouter.</div>

  <div class="actions">
    <button class="btn secondary" id="editToggle" type="button">Modifier la liste</button>
  </div>

  <h2>30 derniers jours</h2>
  <div class="history" id="history"></div>
  <div class="legend">Plus la case est verte, plus tu as validé de tâches ce jour-là.</div>

  <h2>Sauvegarde</h2>
  <div class="data-btns">
    <button class="btn secondary" id="exportBtn" type="button">Exporter</button>
    <button class="btn secondary" id="importBtn" type="button">Importer</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</main>

<script>
  const KEY = 'taches-quotidiennes-v1';
  const DEFAULT_TASKS = ['Boire 1,5 L d\'eau', 'Faire 20 min de sport', 'Lire 15 minutes'];

  // Etat : { tasks: [{id, name}], log: { 'AAAA-MM-JJ': { taskId: 'HH:MM' } } }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { tasks: DEFAULT_TASKS.map(name => ({ id: uid(), name })), log: {} };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function dayKey(d = new Date()) {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  let state = load();
  let today = dayKey();

  const $ = id => document.getElementById(id);
  const list = $('list');

  function todayLog() { return state.log[today] || {}; }

  function render() {
    $('date').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

    const log = todayLog();
    list.innerHTML = state.tasks.map((t, i) => {
      const done = !!log[t.id];
      return `<li class="task${done ? ' done' : ''}" data-id="${t.id}">
        <span class="check"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L19 7"/></svg></span>
        <span class="task-name">${escapeHtml(t.name)}</span>
        ${done ? `<span class="task-time">${log[t.id]}</span>` : ''}
        <span class="edit-btns">
          <button class="icon-btn" data-act="up" ${i === 0 ? 'disabled' : ''} aria-label="Monter">↑</button>
          <button class="icon-btn" data-act="rename" aria-label="Renommer">✎</button>
          <button class="icon-btn del" data-act="del" aria-label="Supprimer">✕</button>
        </span>
      </li>`;
    }).join('');
    $('empty').hidden = state.tasks.length > 0;

    const total = state.tasks.length;
    const doneCount = state.tasks.filter(t => log[t.id]).length;
    $('count').textContent = total && doneCount === total
      ? `Tout est fait ! ${doneCount} / ${total}`
      : `${doneCount} / ${total} tâches faites`;
    $('bar').firstElementChild.style.width = total ? (doneCount / total * 100) + '%' : '0';
    $('bar').classList.toggle('full', total > 0 && doneCount === total);

    const s = streak();
    $('streak').textContent = s > 0 ? `🔥 ${s} jour${s > 1 ? 's' : ''} d'affilée` : '';

    renderHistory();
  }

  // Jours consécutifs où toutes les tâches ont été faites (aujourd'hui compte s'il est complet)
  function streak() {
    if (!state.tasks.length) return 0;
    const ids = state.tasks.map(t => t.id);
    const complete = k => { const l = state.log[k] || {}; return ids.every(id => l[id]); };
    const d = new Date();
    let n = 0;
    if (!complete(dayKey(d))) d.setDate(d.getDate() - 1);
    while (complete(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function renderHistory() {
    const cells = [];
    const d = new Date();
    d.setDate(d.getDate() - 29);
    for (let i = 0; i < 30; i++) {
      const k = dayKey(d);
      const count = Object.keys(state.log[k] || {}).length;
      const ratio = state.tasks.length ? count / state.tasks.length : 0;
      const lvl = ratio >= 1 ? 3 : ratio >= 0.5 ? 2 : ratio > 0 ? 1 : 0;
      cells.push(`<div class="day lvl${lvl}${k === today ? ' today' : ''}" title="${k} : ${count} tâche(s)">${d.getDate()}</div>`);
      d.setDate(d.getDate() + 1);
    }
    $('history').innerHTML = cells.join('');
  }

  list.addEventListener('click', e => {
    const li = e.target.closest('.task');
    if (!li) return;
    const id = li.dataset.id;
    const btn = e.target.closest('button');

    if (document.body.classList.contains('editing')) {
      if (!btn) return;
      const idx = state.tasks.findIndex(t => t.id === id);
      const act = btn.dataset.act;
      if (act === 'del' && confirm(`Supprimer « ${state.tasks[idx].name} » ?`)) {
        state.tasks.splice(idx, 1);
      } else if (act === 'rename') {
        const name = prompt('Nouveau nom :', state.tasks[idx].name);
        if (name && name.trim()) state.tasks[idx].name = name.trim();
      } else if (act === 'up' && idx > 0) {
        [state.tasks[idx - 1], state.tasks[idx]] = [state.tasks[idx], state.tasks[idx - 1]];
      }
      save(); render();
      return;
    }

    const log = state.log[today] || (state.log[today] = {});
    if (log[id]) {
      delete log[id];
      if (!Object.keys(log).length) delete state.log[today];
    } else {
      log[id] = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      if (navigator.vibrate) navigator.vibrate(15);
    }
    save(); render();
  });

  $('editToggle').addEventListener('click', () => {
    const editing = document.body.classList.toggle('editing');
    $('editToggle').textContent = editing ? 'Terminé' : 'Modifier la liste';
    if (editing) $('newTask').focus();
  });

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('newTask').value.trim();
    if (!name) return;
    state.tasks.push({ id: uid(), name });
    $('newTask').value = '';
    save(); render();
  });

  $('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `taches-${today}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.tasks) || typeof data.log !== 'object') throw new Error();
      if (confirm('Remplacer les données actuelles par celles du fichier ?')) {
        state = data; save(); render();
      }
    } catch (err) {
      alert('Fichier invalide.');
    }
    e.target.value = '';
  });

  // Passage à un nouveau jour quand l'app revient au premier plan
  function refreshDay() {
    const k = dayKey();
    if (k !== today) { today = k; render(); }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshDay(); });
  setInterval(refreshDay, 60 * 1000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  render();
</script>
</body>
</html>
